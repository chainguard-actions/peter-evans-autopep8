name: Test diff mode on Python file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a Python file with PEP8 violations
        run: |
          mkdir -p "$GITHUB_WORKSPACE/pyfiles"
          cat > "$GITHUB_WORKSPACE/pyfiles/test_diff.py" << 'EOF'
          x=1
          y=2
          z=x+y
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          args: '--diff /github/workspace/pyfiles/test_diff.py'
      - name: Assert action ran successfully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit-code output: $EXIT_CODE"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded in diff mode"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action failed unexpectedly in diff mode"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
