name: Test format Python file in-place
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a Python file with style issues
        run: |
          mkdir -p "$GITHUB_WORKSPACE/pyfiles"
          cat > "$GITHUB_WORKSPACE/pyfiles/test_format.py" << 'EOF'
          import os,sys
          x=1+2
          y = [1,2,3]
          def foo( a,b ):
              return a+b
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          args: '--in-place /github/workspace/pyfiles/test_format.py'
      - name: Assert action ran successfully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit-code output: $EXIT_CODE"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with in-place formatting"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action failed unexpectedly for in-place formatting"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
