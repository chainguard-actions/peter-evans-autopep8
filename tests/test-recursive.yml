name: Test recursive formatting of a directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create Python files with style issues in workspace subdirectory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/pyfiles"
          cat > "$GITHUB_WORKSPACE/pyfiles/a.py" << 'EOF'
          import os,sys
          x=1+2
          EOF
          cat > "$GITHUB_WORKSPACE/pyfiles/b.py" << 'EOF'
          def bar(a,b):
              return a+b
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          args: '--in-place --recursive /github/workspace/pyfiles'
      - name: Assert action ran successfully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit-code output: $EXIT_CODE"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with recursive formatting"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action failed unexpectedly for recursive formatting"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
